name: Build Windows

  on:
    push:
      branches: ['**']
    workflow_dispatch:

  jobs:
    build-windows:
      runs-on: windows-latest

      env:
        QT_VERSION: 6.6.3

      steps:
      - name: Get sources
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 10

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtremoteobjects qt5compat qtshadertools'
          setup-python: 'true'
          aqtversion: '==3.3.0'
          py7zrversion: '==0.22.*'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: 'x64'

      - name: Install Conan
        run: pip install "conan==2.28.0"

      - name: Setup Conan profile
        run: |
          conan profile detect --force
          conan remote add amnezia "https://artifactory.amnezia.org/artifactory/api/conan/client-prebuilts" --force

      - name: Build
        run: deploy\build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AmneziaVPN-Windows
          path: |
            deploy/build/**/*.exe
            deploy/build/**/*.msi
          if-no-files-found: warn
  